[project]
name = "speakup-server"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.136.3",
    "httpx>=0.28.1",
    "langchain-openai>=1.2.2",
    # LLM trace 双写（services/llm_trace.py）；代码按 v4 API 写，别降 v3
    "langfuse>=4",
    "motor>=3.7.1",
    "openai>=2.38.0",
    "oss2>=2.19.1",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.29",
    "pyyaml>=6.0.3",
    "uvicorn>=0.47.0",
    "websockets>=16.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --tb=short --cov --cov-report=term-missing --cov-fail-under=80"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["."]
omit = [
    "tests/*",
    "main.py",
    # 评测脚手架（不是被测对象，是测试基础设施本身——给 corrector 当底线，不归覆盖率门槛管）
    "evals/*",
    "scripts/*",
    # 纯外部服务适配器：测试里整个 mock（见 conftest），无分支业务逻辑，
    # 测内部 = mock 第三方 SDK/HTTP，价值低。门槛守护业务逻辑而非 IO 胶水。
    "services/wanx.py",          # Seedream 文生图（httpx 直发）
    "services/transcriber.py",   # openspeech ASR
    "services/tts.py",           # openspeech TTS
    "services/volc_video.py",    # Agent Plan 视频任务 API
    "services/llm_trace.py",     # Langfuse SDK 适配层（未配 env 即 no-op）
]

[tool.coverage.report]
# 外部 IO 出口（LLM/OSS/ASR/TTS）在测试里全 mock，低覆盖可接受；
# 核心业务逻辑（routes/corrector/scenario）才是门槛真正守护的对象。
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]

# 结构性硬约束：超长行/圈复杂度/函数规模。阈值显式写出，作为 agent 写代码的机械门禁。
[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E501", "C901", "PLR0911", "PLR0912", "PLR0913", "PLR0915"]

# 存量基线，只减不增：这些文件的超长行在 LLM 提示词 / HTML 模板的三引号字符串内部，
# 换行会改变字符串内容，无法治理；文件内其余结构规则照常生效。
[tool.ruff.lint.per-file-ignores]
"evals/scenario_review.py" = ["E501"]
"services/corrector.py" = ["E501"]
"services/corrector_prompts.py" = ["E501"]
"services/followup_chat.py" = ["E501"]
"services/public_scenario_service.py" = ["E501"]
"services/scenario_service.py" = ["E501"]
"scripts/corrector_breakdown_html.py" = ["E501"]
"scripts/llm_breakdown_html.py" = ["E501"]
"tests/unit/test_corrector_logic.py" = ["E501"]

[tool.ruff.lint.pylint]
max-args = 5
max-branches = 12
max-statements = 50
max-returns = 6

[tool.ruff.lint.mccabe]
max-complexity = 10
