[project]
name = "speakup-server"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "dashscope>=1.20.0",
    "fastapi>=0.136.3",
    "httpx>=0.28.1",
    "langchain-openai>=1.2.2",
    "motor>=3.7.1",
    "openai>=2.38.0",
    "oss2>=2.19.1",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.29",
    "pyyaml>=6.0.3",
    "uvicorn>=0.47.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --tb=short --cov --cov-report=term-missing --cov-fail-under=80"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["."]
omit = [
    "tests/*",
    "main.py",
    # 纯外部服务适配器：测试里整个 mock（见 conftest），无分支业务逻辑，
    # 测内部 = mock 第三方 SDK/HTTP，价值低。门槛守护业务逻辑而非 IO 胶水。
    "services/wanx.py",          # 通义万相文生图（httpx 直发）
    "services/transcriber.py",   # DashScope ASR
]

[tool.coverage.report]
# 外部 IO 出口（LLM/OSS/ASR/TTS）在测试里全 mock，低覆盖可接受；
# 核心业务逻辑（routes/corrector/scenario）才是门槛真正守护的对象。
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]
