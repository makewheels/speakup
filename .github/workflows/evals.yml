name: Evals (manual)

# 手动触发的评测 workflow：跑 evals regression 集，出 HTML 报告 artifact。
# 不接 pull_request 自动跑——pass^k 对 LLM 随机性敏感，基线尚未 100%，自动跑会频繁误报。
#
# 需要的 secrets：
#   DASHSCOPE_API_KEY      百炼 key（评测默认 provider，已存在）
#   LANGFUSE_PUBLIC_HOST   （可选）langfuse 公网入口，如 http://<IP>:30030；
#                          不配则本次运行关闭 trace 上报（llm_trace 自动 no-op）
#   LANGFUSE_PUBLIC_KEY / LANGFUSE_SECRET_KEY（可选，配合上面使用）

on:
  workflow_dispatch:
    inputs:
      suite:
        description: "任务集：regression / capability / all"
        default: regression
      trials:
        description: "每条任务跑几次（pass@k / pass^k 的 k）"
        default: "3"
      model:
        description: "百炼模型名"
        default: "glm-5.2"

jobs:
  evals:
    name: Run evals
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with: { enable-cache: true }
      - name: Sync deps
        working-directory: server
        run: uv sync --frozen
      - name: Run evals
        working-directory: server
        env:
          CHAT_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          CHAT_BASE_URL: https://dashscope.aliyuncs.com/compatible-mode/v1
          CHAT_MODEL: ${{ inputs.model }}
          CHAT_THINKING: "false"
          LANGFUSE_HOST: ${{ secrets.LANGFUSE_PUBLIC_HOST }}
          LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
          LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
        run: |
          # 未配公网 langfuse 入口时整体关闭 trace（避免 SDK 误连 cloud 产生告警噪音）
          if [ -z "$LANGFUSE_HOST" ]; then
            unset LANGFUSE_HOST LANGFUSE_PUBLIC_KEY LANGFUSE_SECRET_KEY
          fi
          uv run python -m evals.run \
            --suite "${{ inputs.suite }}" \
            --trials "${{ inputs.trials }}" \
            --report "$RUNNER_TEMP/evals-report.html"
      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        with:
          name: evals-report-${{ inputs.suite }}-${{ inputs.model }}
          path: ${{ runner.temp }}/evals-report.html
          if-no-files-found: warn
