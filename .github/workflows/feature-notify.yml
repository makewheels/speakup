name: 功能完成通知

on:
  workflow_dispatch:
    inputs:
      title:
        description: "本次完成功能的标题（单行）"
        required: true
        type: string
      summary:
        description: "给人看的简短说明"
        required: true
        type: string
      points:
        description: "可选功能点，每行一条，最多 6 条"
        required: false
        type: string
      view_url:
        description: "可选查看链接，必须是 HTTP(S) 地址"
        required: false
        type: string
      image_path:
        description: "可选仓库说明图，仅限 docs/assets/feature-notifications 下的 SVG"
        required: false
        type: string
      image_alt:
        description: "可选截图说明，最多 120 个字符"
        required: false
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  send:
    name: 发送功能通知
    runs-on: ubuntu-latest
    steps:
      - name: 限制为默认分支
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]; then
            echo "功能通知只允许从默认分支触发。" >&2
            exit 1
          fi

      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: false

      - name: 运行通知脚本单元测试
        run: uv run --no-project python -m unittest discover -s scripts/tests -p 'test_*.py'

      - name: 从 Infisical 读取通知配置
        uses: Infisical/secrets-action@v1.0.16
        with:
          method: oidc
          identity-id: e0d98dc2-4295-4092-9cb9-6bf891cc3c2d
          oidc-audience: ${{ vars.INFISICAL_OIDC_AUDIENCE }}
          domain: ${{ vars.INFISICAL_DOMAIN }}
          project-slug: speakup-secrets
          env-slug: prod
          secret-path: /notifications
          recursive: false
          include-imports: false

      - name: 校验配置并发送
        env:
          FEATURE_MAIL_TITLE: ${{ inputs.title }}
          FEATURE_MAIL_SUMMARY: ${{ inputs.summary }}
          FEATURE_MAIL_POINTS: ${{ inputs.points }}
          FEATURE_MAIL_VIEW_URL: ${{ inputs.view_url }}
          FEATURE_MAIL_IMAGE_PATH: ${{ inputs.image_path }}
          FEATURE_MAIL_IMAGE_ALT: ${{ inputs.image_alt }}
          FEATURE_MAIL_NOTIFICATION_ID: ${{ github.run_id }}
        run: uv run --no-project python scripts/send_feature_email.py
