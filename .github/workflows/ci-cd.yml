name: CI / CD

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test-server:
    name: Server tests (pytest)
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "echo 'db.runCommand({ ping: 1 })' | mongosh --quiet"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Sync deps
        working-directory: server
        run: uv sync --frozen

      - name: Run pytest
        working-directory: server
        run: uv run pytest -v

  test-web:
    name: Web tests + build (vitest + vite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Run vitest
        working-directory: web
        run: pnpm test

      - name: Build
        working-directory: web
        run: pnpm run build

  deploy:
    name: Deploy to production
    needs: [test-server, test-web]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Build web
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Install SSH key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          known_hosts: ${{ secrets.SSH_KNOWN_HOSTS }}

      - name: Deploy code
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
        run: |
          # 创建目录 + 迁移旧 client→web
          ssh ${USER}@${HOST} 'bash -s' << 'PREP'
          sudo mkdir -p /opt/speakup
          cd /opt/speakup
          if [ -d client/dist ] && [ ! -d web/dist ]; then
            mv client web
          fi
          mkdir -p web/dist
          PREP
          rsync -avz --delete \
            --exclude='.env' --exclude='.env.*' \
            --exclude='__pycache__' --exclude='.pytest_cache' \
            --exclude='.venv' \
            --exclude='tests' \
            ./server/ ${USER}@${HOST}:/opt/speakup/server/
          rsync -avz --delete ./web/dist/ ${USER}@${HOST}:/opt/speakup/web/dist/

      - name: Setup env and restart
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          MONGO_URI: ${{ secrets.MONGO_URI }}
        run: |
          ssh ${USER}@${HOST} 'bash -s' << 'REMOTE'
          export PATH="$HOME/.local/bin:$PATH"
          which uv 2>/dev/null || curl -LsSf https://astral.sh/uv/install.sh | sh

          cd /opt/speakup

          # 更新 Nginx 中的路径（client/dist → web/dist，幂等）
          sudo sed -i 's|/opt/speakup/client/dist|/opt/speakup/web/dist|g' /etc/nginx/sites-available/speakup
          sudo nginx -t && sudo systemctl reload nginx

          cat > .env.production << ENVEOF
          DASHSCOPE_API_KEY='"$DASHSCOPE_API_KEY"'
          MONGO_URI='"$MONGO_URI"'
          PORT=3001
          APP_ENV=production
          ENVEOF

          cd server
          uv sync

          export PATH="$HOME/.local/bin:$PATH"
          pm2 delete speakup-server 2>/dev/null || true
          pm2 start --interpreter "$HOME/.local/bin/uv" --interpreter-args "run python" main.py --name speakup-server
          pm2 save
          REMOTE
