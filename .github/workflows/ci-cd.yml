name: CI / CD

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test-server:
    name: Server tests (pytest)
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "echo 'db.runCommand({ ping: 1 })' | mongosh --quiet"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Sync deps
        working-directory: server
        run: uv sync --frozen

      - name: Run pytest
        working-directory: server
        run: uv run pytest -v

  test-web:
    name: Web tests + build (vitest + vite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Run vitest
        working-directory: web
        run: pnpm test

      - name: Build
        working-directory: web
        run: pnpm run build

  # 生产环境已下线（2026-06：原服务器重装挪作他用），deploy job 移除。
  # 将来重新部署时从 git 历史找回（PR #32 之前的 ci-cd.yml）。
