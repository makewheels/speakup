name: CI / CD

on:
  push:
    branches: [main, master]
  pull_request:

env:
  ACR: registry.cn-beijing.aliyuncs.com
  ACR_IMAGE: registry.cn-beijing.aliyuncs.com/b4/speakup
  SERVER_DIR: /opt/speakup

jobs:
  test-server:
    name: Server tests (pytest)
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "echo 'db.runCommand({ ping: 1 })' | mongosh --quiet"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with: { enable-cache: true }
      - name: Sync deps
        working-directory: server
        run: uv sync --frozen
      - name: Code quality gates
        working-directory: server
        run: uv run python scripts/check_code_quality.py
      - name: Run pytest
        working-directory: server
        run: uv run pytest -v

  test-web:
    name: Web tests + build (vitest + vite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
        with: { version: 10 }
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install
        working-directory: web
        run: pnpm install --frozen-lockfile
      - name: Lint
        working-directory: web
        run: pnpm run lint
      - name: Run vitest
        working-directory: web
        run: pnpm test
      - name: Coverage check
        working-directory: web
        run: pnpm test:coverage
      - name: Build
        working-directory: web
        run: pnpm run build

  deploy:
    name: Build & Deploy
    needs: [test-server, test-web]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Login to ACR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.ACR }}
          username: ${{ secrets.ACR_AK_ID }}
          password: ${{ secrets.ACR_AK_SECRET }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Compute image tag
        id: tag
        run: |
          # 北京时间 + run 序号，与 b4/video-2022 风格一致：YYYYMMDD-HHMMSS-NNNN
          TS=$(TZ=Asia/Shanghai date +%Y%m%d-%H%M%S)
          SEQ=$(printf "%06d" "${{ github.run_number }}")
          echo "value=${TS}-${SEQ}" >> "$GITHUB_OUTPUT"

      - name: Build and push speakup
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.ACR_IMAGE }}:latest
            ${{ env.ACR_IMAGE }}:${{ steps.tag.outputs.value }}
          cache-from: type=gha,scope=speakup
          cache-to: type=gha,scope=speakup,mode=max
          provenance: false

      - name: Install SSH key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          known_hosts: ${{ secrets.SSH_KNOWN_HOSTS }}

      - name: Sync compose
        run: |
          rsync -az -e "ssh -o ServerAliveInterval=30" \
            docker-compose.yml \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${{ env.SERVER_DIR }}/

      - name: Write server .env
        run: |
          cat <<__ENVEOF__ | \
            ssh -o ServerAliveInterval=30 ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            "cat > ${{ env.SERVER_DIR }}/.env"
          CHAT_API_KEY=${{ secrets.CHAT_API_KEY }}
          CHAT_BASE_URL=https://ark.cn-beijing.volces.com/api/plan/v3
          CHAT_MODEL=glm-5.2
          CHAT_THINKING=false
          IMAGE_API_KEY=${{ secrets.CHAT_API_KEY }}
          IMAGE_BASE_URL=https://ark.cn-beijing.volces.com/api/plan/v3
          IMAGE_MODEL=doubao-seedream-5.0-lite
          IMAGE_SIZE=2560x1440
          IMAGE_ENABLED=true
          VOICE_API_KEY=${{ secrets.CHAT_API_KEY }}
          VOICE_APP_KEY=plan
          VOICE_BASE_URL=https://openspeech.bytedance.com/api/v3/plan
          VOICE_WS_BASE_URL=wss://openspeech.bytedance.com/api/v3/plan
          VOICE_TTS_URL=https://openspeech.bytedance.com/api/v3/plan/tts/unidirectional
          VOICE_ASR_URL=wss://openspeech.bytedance.com/api/v3/plan/sauc/bigmodel_nostream
          TTS_RESOURCE_ID=seed-tts-2.0
          TTS_MODEL=seed-tts-2.0
          TTS_VOICE=zh_female_vv_uranus_bigtts
          ASR_RESOURCE_ID=volc.seedasr.sauc.duration
          ASR_MODEL=bigmodel
          VIDEO_API_KEY=${{ secrets.CHAT_API_KEY }}
          VIDEO_BASE_URL=https://ark.cn-beijing.volces.com/api/plan/v3
          VIDEO_MODEL=doubao-seedance-1.5-pro
          VIDEO_ENABLED=${{ vars.VIDEO_ENABLED || 'false' }}
          VIDEO_POLL_INTERVAL_SECONDS=${{ vars.VIDEO_POLL_INTERVAL_SECONDS || '5' }}
          VIDEO_POLL_TIMEOUT_SECONDS=${{ vars.VIDEO_POLL_TIMEOUT_SECONDS || '180' }}
          APP_LOG_DIR=/app/logs
          APP_LOG_ROTATE_WHEN=midnight
          APP_LOG_ROTATE_INTERVAL=1
          APP_LOG_BACKUP_COUNT=30
          APP_LOG_UTC=false
          LOG_LEVEL=INFO
          MONGO_URI=${{ secrets.MONGO_URI }}
          OSS_BUCKET_PROD=${{ secrets.OSS_BUCKET_PROD }}
          OSS_ACCESS_KEY_ID=${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET=${{ secrets.OSS_ACCESS_KEY_SECRET }}
          OSS_ENDPOINT=${{ secrets.OSS_ENDPOINT }}
          __ENVEOF__

      - name: Pull and restart
        run: |
          H="${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}"

          # 服务器 docker login ACR（用主账号固定密码，stdin 不入 log）
          echo "${{ secrets.ACR_AK_SECRET }}" | \
            ssh -o ServerAliveInterval=30 "$H" \
            "docker login --username=${{ secrets.ACR_AK_ID }} --password-stdin ${{ env.ACR }} >/dev/null 2>&1"

          ssh -o ServerAliveInterval=30 "$H" /bin/bash -s << 'PULL'
          set -e
          IMG=registry.cn-beijing.aliyuncs.com/b4/speakup
          cd /opt/speakup
          mkdir -p /opt/speakup/logs

          # 把"当前正在跑的 image"标成 :previous（回滚锚点）。
          # 一定在 pull 新版之前做：否则 :latest 已被新版覆盖，previous 会指向新版本身。
          # 基于 running container 的 image ID 而不是 tag，确保抓到的是"实际在跑的"那一版。
          RUNNING=$(docker inspect speakup --format '{{.Image}}' 2>/dev/null || true)
          if [ -n "$RUNNING" ]; then
            docker tag "$RUNNING" "${IMG}:previous"
            echo "tagged previous -> $RUNNING"
          else
            echo "no running speakup container, skip previous tag"
          fi

          docker pull "${IMG}:latest"
          docker compose down --remove-orphans 2>/dev/null || true
          docker compose up -d --wait --wait-timeout 60
          docker image prune -f
          echo "=== deploy done ==="
          docker compose ps
          PULL

      - name: Smoke check
        run: |
          set -euo pipefail
          # 容器 healthcheck 已就绪才会到这；探 /api/health（不打 Mongo），仍重试覆盖网关刷新窗口
          for i in 1 2 3 4 5 6; do
            if curl -fsS -m 15 "https://${{ secrets.DOMAIN }}/api/health" -o /tmp/probe.json; then
              echo "smoke ok (attempt $i)"
              head -c 200 /tmp/probe.json; echo
              exit 0
            fi
            echo "smoke attempt $i failed, sleep 5"
            sleep 5
          done
          echo "smoke check failed after 6 attempts"
          exit 1
