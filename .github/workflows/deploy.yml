name: Deploy to Production

on:
  push:
    branches: [main, master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Build client
        run: |
          cd client
          pnpm install
          pnpm run build

      - name: Install SSH key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          known_hosts: ${{ secrets.SSH_KNOWN_HOSTS }}

      - name: Deploy files
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh ${USER}@${HOST} "mkdir -p /opt/speakup"
          rsync -avz --delete ./server/ ${USER}@${HOST}:/opt/speakup/server/
          rsync -avz --delete ./client/dist/ ${USER}@${HOST}:/opt/speakup/client/dist/

      - name: Install deps and restart
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          MONGO_URI: ${{ secrets.MONGO_URI }}
        run: |
          ssh ${USER}@${HOST} "cat > /opt/speakup/.env.production << 'EOF'
          NODE_ENV=production
          DASHSCOPE_API_KEY=${DASHSCOPE_API_KEY}
          MONGO_URI=${MONGO_URI}
          PORT=3001
          EOF"
          ssh ${USER}@${HOST} "cd /opt/speakup/server && uv sync && pm2 restart speakup-server || pm2 start --interpreter python3 main.py --name speakup-server && pm2 save"
