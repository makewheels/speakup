services:
  speakup:
    image: registry.cn-beijing.aliyuncs.com/b4/speakup:latest
    container_name: speakup
    restart: unless-stopped
    environment:
      - APP_ENV=production
      - PORT=3001
      - APP_LOG_DIR=/app/logs
      - APP_LOG_ROTATE_WHEN=${APP_LOG_ROTATE_WHEN:-midnight}
      - APP_LOG_ROTATE_INTERVAL=${APP_LOG_ROTATE_INTERVAL:-1}
      - APP_LOG_BACKUP_COUNT=${APP_LOG_BACKUP_COUNT:-30}
      - APP_LOG_UTC=${APP_LOG_UTC:-false}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      # 文字/对话 LLM（火山方舟 Agent Plan）
      - CHAT_API_KEY=${CHAT_API_KEY}
      - CHAT_BASE_URL=${CHAT_BASE_URL:-https://ark.cn-beijing.volces.com/api/plan/v3}
      - CHAT_MODEL=${CHAT_MODEL:-glm-5.2}
      - CHAT_THINKING=${CHAT_THINKING:-false}
      # 图片生成（火山 Seedream，默认关闭省钱）
      - IMAGE_API_KEY=${IMAGE_API_KEY}
      - IMAGE_BASE_URL=${IMAGE_BASE_URL:-https://ark.cn-beijing.volces.com/api/plan/v3}
      - IMAGE_MODEL=${IMAGE_MODEL:-doubao-seedream-5.0-lite}
      - IMAGE_SIZE=${IMAGE_SIZE:-2560x1440}
      - IMAGE_ENABLED=${IMAGE_ENABLED:-false}
      # 语音 ASR + TTS（火山 openspeech Agent Plan）
      - VOICE_API_KEY=${VOICE_API_KEY}
      - VOICE_APP_KEY=${VOICE_APP_KEY:-plan}
      - VOICE_BASE_URL=${VOICE_BASE_URL:-https://openspeech.bytedance.com/api/v3/plan}
      - VOICE_WS_BASE_URL=${VOICE_WS_BASE_URL:-wss://openspeech.bytedance.com/api/v3/plan}
      - VOICE_TTS_URL=${VOICE_TTS_URL:-https://openspeech.bytedance.com/api/v3/plan/tts/unidirectional}
      - VOICE_ASR_URL=${VOICE_ASR_URL:-wss://openspeech.bytedance.com/api/v3/plan/sauc/bigmodel_nostream}
      - TTS_RESOURCE_ID=${TTS_RESOURCE_ID:-seed-tts-2.0}
      - TTS_MODEL=${TTS_MODEL:-seed-tts-2.0}
      - TTS_VOICE=${TTS_VOICE:-zh_female_vv_uranus_bigtts}
      - ASR_RESOURCE_ID=${ASR_RESOURCE_ID:-volc.seedasr.sauc.duration}
      - ASR_MODEL=${ASR_MODEL:-bigmodel}
      # 视频生成 helper（未接 UI）
      - VIDEO_API_KEY=${VIDEO_API_KEY}
      - VIDEO_BASE_URL=${VIDEO_BASE_URL:-https://ark.cn-beijing.volces.com/api/plan/v3}
      - VIDEO_MODEL=${VIDEO_MODEL:-doubao-seedance-1.5-pro}
      - VIDEO_ENABLED=${VIDEO_ENABLED:-false}
      - VIDEO_POLL_INTERVAL_SECONDS=${VIDEO_POLL_INTERVAL_SECONDS:-5}
      - VIDEO_POLL_TIMEOUT_SECONDS=${VIDEO_POLL_TIMEOUT_SECONDS:-180}
      - MONGO_URI=${MONGO_URI}
      - OSS_ACCESS_KEY_ID=${OSS_ACCESS_KEY_ID}
      - OSS_ACCESS_KEY_SECRET=${OSS_ACCESS_KEY_SECRET}
      - OSS_ENDPOINT=${OSS_ENDPOINT:-https://oss-cn-beijing.aliyuncs.com}
      - OSS_BUCKET=${OSS_BUCKET_PROD}
    expose:
      - "3001"
    volumes:
      - /opt/speakup/logs:/app/logs
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:3001/api/health',timeout=3).status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    networks: [edge]

networks:
  edge:
    external: true
    name: edge
