services:
  speakup:
    image: registry.cn-beijing.aliyuncs.com/b4/speakup:latest
    container_name: speakup
    restart: unless-stopped
    environment:
      - APP_ENV=production
      - PORT=3001
      # 文字/对话 LLM（火山方舟 Coding Plan glm-5.2 + thinking）
      - CHAT_API_KEY=${CHAT_API_KEY}
      - CHAT_BASE_URL=${CHAT_BASE_URL:-https://ark.cn-beijing.volces.com/api/coding/v3}
      - CHAT_MODEL=${CHAT_MODEL:-glm-5.2}
      - CHAT_THINKING=${CHAT_THINKING:-true}
      # 图片生成（阿里云万相，默认关闭省钱）
      - IMAGE_API_KEY=${IMAGE_API_KEY}
      - IMAGE_BASE_URL=${IMAGE_BASE_URL:-https://dashscope.aliyuncs.com}
      - IMAGE_MODEL=${IMAGE_MODEL:-wanx2.1-t2i-turbo}
      - IMAGE_ENABLED=${IMAGE_ENABLED:-false}
      # 语音 ASR + TTS（阿里云 DashScope）
      - VOICE_API_KEY=${VOICE_API_KEY}
      - VOICE_BASE_URL=${VOICE_BASE_URL:-https://dashscope.aliyuncs.com}
      - MONGO_URI=${MONGO_URI}
      - OSS_ACCESS_KEY_ID=${OSS_ACCESS_KEY_ID}
      - OSS_ACCESS_KEY_SECRET=${OSS_ACCESS_KEY_SECRET}
      - OSS_ENDPOINT=${OSS_ENDPOINT:-https://oss-cn-beijing.aliyuncs.com}
      - OSS_BUCKET=${OSS_BUCKET_PROD}
    expose:
      - "3001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:3001/api/health',timeout=3).status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    networks: [edge]

networks:
  edge:
    external: true
    name: edge
