  <circle cx="842" cy="453" r="8" fill="#3d78d8"/>
  <text x="866" y="460" fill="#34445f" font-family="Arial, sans-serif" font-size="17">分享精确打开本次结果</text>
  <circle cx="842" cy="502" r="8" fill="#3d78d8"/>
  <text x="866" y="509" fill="#34445f" font-family="Arial, sans-serif" font-size="17">错误发音模块已撤下</text>

